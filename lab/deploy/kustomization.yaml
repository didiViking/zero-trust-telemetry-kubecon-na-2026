# Lab overlay: reuses the repository's blueprint (manifests/) unchanged and adds only what the
# blueprint says it does NOT provide (backend, trust bundle, client). Render with:
#   kubectl kustomize --load-restrictor=LoadRestrictionsNone lab/deploy
# (the restrictor flag is needed because ../../manifests/*.yaml are plain files outside this dir).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../manifests/00-foundation.yaml
  - ../../manifests/01-certificates.yaml
  - ../../manifests/02-networkpolicies.yaml
  - ../backend
  - ../traffic-generator
  # Generated by lab/pki/distribute-trust.sh (public CA certificate only; gitignored).
  - ../.work/trust-bundles.yaml
patches:
  - target: {kind: Namespace, name: telemetry-secure}
    patch: |-
      - op: add
        path: /metadata/labels/pod-security.kubernetes.io~1enforce
        value: restricted
      - op: add
        path: /metadata/labels/app.kubernetes.io~1part-of
        value: zero-trust-telemetry-lab
labels:
  - pairs: {app.kubernetes.io/part-of: zero-trust-telemetry-lab}
    includeSelectors: false
